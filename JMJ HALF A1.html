<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSR Mark Management System</title>
<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#c3ecff,#fbc2eb);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  background:#fff;
  width:420px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}
h1,h2,h3{text-align:center;margin:6px 0;}
select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  font-size:16px;
}
button{
  background:#6a11cb;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.result{
  margin-top:15px;
  padding:15px;
  background:#f5f5f5;
  border-radius:10px;
}
.blue{color:#0066cc;font-weight:bold;}
.red{color:#cc0000;font-weight:bold;}
.total{
  text-align:center;
  font-size:34px;
  font-weight:800;
  color:#7b2cbf;
  background:#fff3cd;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}
.pass{color:green;font-weight:bold;text-align:center;}
.fail{color:red;font-weight:bold;text-align:center;}
.withheld{color:#ff8c00;font-weight:bold;text-align:center;}
.progress{
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}
.progress div{
  height:18px;
  background:linear-gradient(90deg,#00c6ff,#0072ff);
}
</style>
</head>

<body>
<div class="card">
  <h1>🎓 GSR Mark Management System</h1>
  <h2>HALF YEARLY PHYSICS</h2>
  <h3>STD 12 – A1</h3>

  <select id="student">
    <option value="">Select Student Name</option>
  </select>

  <button onclick="showResult()">View Result</button>

  <div id="output"></div>
</div>

<script>
const students = {
 "Akshaya":{theory:28, practical:20},
 "Harshani":{theory:28, practical:30},
 "Krishnika":{theory:58, practical:30},
 "Monisha":{theory:23, practical:20},
 "Nisha":{theory:36, practical:30},
 "Priyadharshini":{theory:41, practical:30},
 "Ragavi":{theory:26, practical:20},
 "Sadhana":{theory:68, practical:30},
 "Sandhiya":{theory:68, practical:30},
 "Selvakarasi":{theory:29, practical:20},
 "Shamyuktha":{theory:51, practical:25},
 "Sriharini":{theory:42, practical:20},
 "Sugandhi":{theory:16, practical:20},
 "Thanshila Banu":{theory:34, practical:30},
 "Abinesh":{theory:61, practical:30},
 "Antovigil":{theory:19, practical:20},
 "Balaprasath":{theory:19, practical:23},
 "Brundesh":{theory:19, practical:24},
 "Gokul":{theory:13, practical:22},
 "Gurudeep":{theory:16, practical:25},
 "Hariprakash":{theory:16, practical:15},
 "Hariharan":{theory:44, practical:30},
 "Hemanth":{theory:25, practical:25},
 "Hemnath":{theory:24, practical:30},
 "Jagadeeshwaran":{theory:15, practical:20},
 "John Prince":{theory:15, practical:23},
 "Logesh":{theory:25, practical:30},
 "Motheesh":{theory:22, practical:20},
 "Pravin Kumar":{theory:15, practical:20},
 "Ramachandru":{theory:15, practical:20},
 "Ravichandran":{theory:18, practical:24},
 "Rohith Kumar":{theory:38, practical:30},
 "Sekkuvera":{theory:20, practical:30},
 "Sujith":{theory:25, practical:15},
 "Thamizhvanan":{theory:24, practical:25},
 "Vishwa":{theory:24, practical:25}
};

const sel = document.getElementById("student");
for(let s in students){
  sel.innerHTML += `<option value="${s}">${s}</option>`;
}

function showResult(){
  const name = sel.value;
  if(!name) return;

  const t = students[name].theory;
  const p = students[name].practical;
  const total = t + p;
  const percent = total;

  let status = "";
  if(t === "ABSENT"){
    status = "<p class='withheld'>RESULT WITHHELD (ABSENT)</p>";
  }else if(t >= 15){
    status = "<p class='pass'>PASS</p>";
  }else{
    status = "<p class='fail'>FAIL</p>";
  }

  document.getElementById("output").innerHTML = `
    <div class="result">
      <p class="blue">Theory (70): ${t}</p>
      <p class="red">Practical (30): ${p}</p>

      <div class="total">${total} / 100</div>

      ${status}

      <div class="progress">
        <div style="width:${percent}%"></div>
      </div>
      <p style="text-align:right;">${percent}%</p>
    </div>
  `;
}
</script>
</body>
</html>
